name: Build Synology package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Check it's static
        run: file target/x86_64-unknown-linux-musl/release/jenova-nas | tee /dev/stderr | grep -q "static"
      - name: Build .spk
        id: spk
        run: |
          SPK=$(BUILD_NUMBER=$(printf '%04d' ${{ github.run_number }}) ./build-spk.sh target/x86_64-unknown-linux-musl/release/jenova-nas dist)
          echo "file=$SPK" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jenova-synology-x86_64
          path: dist/*.spk
      # A push to main with a version that has no release yet publishes it.
      - name: Check for existing release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Exists" only counts if the .spk is attached.
          n=$(gh release view "v${{ steps.spk.outputs.version }}" --repo "${{ github.repository }}" --json assets --jq '[.assets[].name | select(endswith(".spk"))] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: github.event_name == 'push' && steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.spk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Jenova for Synology v${{ steps.spk.outputs.version }}
          files: ${{ steps.spk.outputs.file }}
          make_latest: true
          body: |
            Jenova for Synology DSM 7.2 (x86-64 models such as the DS923+).

            **Install:** Package Center → Manual Install → choose the .spk → Next. DSM installs Python 3.9 automatically if needed.
            **Then:** give the `Jenova` system user Read/Write on your media shares (Control Panel → Shared Folder → Edit → Permissions → System internal user), open Jenova from the main menu, and add your folders.
